# /etc/nginx/sites-available/uom-learning  — host nginx terminates TLS and proxies to the web container
server {
    listen 80;
    server_name learn.34-14-150-134.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name learn.34-14-150-134.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/learn.34-14-150-134.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.34-14-150-134.sslip.io/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
