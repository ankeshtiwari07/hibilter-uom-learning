# Dev overlay: hot-reloading API with the source bind-mounted.
services:
  api:
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"]
    volumes: [ "../backend:/app", "media:/data/media", "../assets:/app/assets:ro" ]
    ports: [ "127.0.0.1:8001:8000" ]
  render:
    volumes: [ "../backend:/app", "media:/data/media", "../assets:/app/assets:ro" ]
