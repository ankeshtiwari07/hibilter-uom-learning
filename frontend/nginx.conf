server {
  listen 80;
  server_tokens off;
  client_max_body_size 25m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=()" always;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  location ^~ /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
  location ^~ /assets/ { alias /srv/assets/; expires 7d; add_header Cache-Control "public"; }
  location ^~ /media/uploads/ { return 404; }  # student uploads are served only through the authenticated API
  location ^~ /media/ { alias /srv/media/; expires 30d; add_header Cache-Control "public, immutable"; }
  location ~* \.(js|css|woff2?|png|svg)$ { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
